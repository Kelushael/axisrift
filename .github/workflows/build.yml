name: build-plugins
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build AU + VST3
        run: |
          cmake --build build --config Release -j3 \
            --target StubbsCue_AU StubbsCue_VST3 AutoQuacker_AU AutoQuacker_VST3
      - name: Package Mac
        run: |
          mkdir -p dist/mac
          for P in StubbsCue AutoQuacker; do
            ART="build/${P}_artefacts/Release"
            if [ -d "$ART/AU" ] && [ -d "$ART/VST3" ]; then
              (cd "$ART" && zip -ry "../../../dist/mac/${P}-macOS-AU-VST3.zip" AU VST3)
            fi
            if [ -d "$ART/AU/${P}.component" ] || [ -d "$ART/AU" ]; then
              COMP=$(find "$ART/AU" -name "*.component" | head -1)
              if [ -n "$COMP" ]; then
                pkgbuild --component "$COMP" \
                  --install-location /Library/Audio/Plug-Ins/Components \
                  --identifier com.axisrift.$(echo $P | tr '[:upper:]' '[:lower:]') \
                  --version 1.1.0 "dist/mac/${P}-AU.pkg" || true
              fi
            fi
          done
          ls -la dist/mac
      - uses: actions/upload-artifact@v4
        with:
          name: axisrift-macOS
          path: dist/mac/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release -j2 --target StubbsCue_VST3 AutoQuacker_VST3
      - name: Package Win
        shell: bash
        run: |
          set -e
          # Windows runners don't ship Info-ZIP — use PowerShell Compress-Archive
          mkdir -p dist/win
          package_vst3 () {
            local name="$1"
            local dir parent base out win_parent win_out
            dir=$(find build -type d -name "${name}.vst3" | head -1)
            if [ -z "$dir" ]; then
              echo "ERROR: no ${name}.vst3 under build/" >&2
              find build -name '*.vst3' -type d | head -20
              return 1
            fi
            parent=$(dirname "$dir")
            base=$(basename "$dir")
            out="$GITHUB_WORKSPACE/dist/win/${name}-Windows-VST3.zip"
            # Convert to Windows paths for PowerShell
            win_parent=$(cygpath -w "$parent" 2>/dev/null || echo "$parent" | sed 's|^/d|D:|;s|/|\\|g')
            win_out=$(cygpath -w "$out" 2>/dev/null || echo "$out" | sed 's|^/d|D:|;s|/|\\|g')
            powershell.exe -NoProfile -Command "
              \$src = Join-Path '${win_parent}' '${base}'
              \$dst = '${win_out}'
              if (Test-Path \$dst) { Remove-Item -Force \$dst }
              Compress-Archive -Path \$src -DestinationPath \$dst -Force
              if (-not (Test-Path \$dst)) { throw 'zip missing' }
              Write-Host \"wrote \$dst size=\$((Get-Item \$dst).Length)\"
            "
          }
          package_vst3 StubbsCue
          package_vst3 AutoQuacker
          ls -la dist/win
          test -s dist/win/StubbsCue-Windows-VST3.zip
          test -s dist/win/AutoQuacker-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: axisrift-Windows
          path: dist/win/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release -j2 --target StubbsCue_VST3 AutoQuacker_VST3
      - name: Package Linux (Debian/Ubuntu)
        run: |
          mkdir -p dist/linux
          find build -type d -name "*.vst3" | while read d; do
            base=$(basename "$d" .vst3)
            (cd "$(dirname "$d")" && zip -ry "$GITHUB_WORKSPACE/dist/linux/${base}-Linux-VST3.zip" "$(basename "$d")")
          done
          ls -la dist/linux
      - uses: actions/upload-artifact@v4
        with:
          name: axisrift-Linux
          path: dist/linux/*
          if-no-files-found: warn
