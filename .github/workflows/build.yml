name: build-plugins
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build AU + VST3
        run: cmake --build build --config Release --target StubbsCue_AU StubbsCue_VST3 -j3
      - name: Show tree on failure
        if: failure()
        run: find build -maxdepth 4 -name "*.component" -o -maxdepth 4 -name "*.vst3" | head -20
      - name: Package
        run: |
          cd "build/StubbsCue_artefacts/Release"
          zip -ry StubbsCue-macOS.zip AU/StubbsCue.component VST3/StubbsCue.vst3
          pkgbuild --component AU/StubbsCue.component \
                   --install-location /Library/Audio/Plug-Ins/Components \
                   --identifier com.axisrift.stubbscue --version 1.0.0 StubbsCue-AU.pkg
      - name: Verify it will actually load
        continue-on-error: true
        run: |
          cd "build/StubbsCue_artefacts/Release"
          B=AU/StubbsCue.component/Contents/MacOS/StubbsCue
          file "$B" || true; lipo -archs "$B" || true
          otool -l "$B" | grep -A3 LC_BUILD_VERSION || true
      - uses: actions/upload-artifact@v4
        with:
          name: StubbsCue-macOS
          path: |
            build/StubbsCue_artefacts/Release/StubbsCue-macOS.zip
            build/StubbsCue_artefacts/Release/StubbsCue-AU.pkg

