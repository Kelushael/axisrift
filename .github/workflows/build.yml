name: build-plugins
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build AU + VST3
        run: cmake --build build --config Release --target StubbsCue_AU StubbsCue_VST3 -j3
      - name: Package
        run: |
          cd "build/StubbsCue_artefacts/Release"
          zip -ry StubbsCue-macOS.zip "AU/Stubbs Cue.component" "VST3/Stubbs Cue.vst3"
          pkgbuild --component "AU/Stubbs Cue.component" \
                   --install-location /Library/Audio/Plug-Ins/Components \
                   --identifier com.axisrift.stubbscue --version 1.0.0 StubbsCue-AU.pkg
      - name: Verify it will actually load
        run: |
          cd "build/StubbsCue_artefacts/Release"
          B="AU/Stubbs Cue.component/Contents/MacOS/Stubbs Cue"
          file "$B"; lipo -archs "$B"
          otool -l "$B" | grep -A3 LC_BUILD_VERSION || otool -l "$B" | grep -A3 LC_VERSION_MIN_MACOSX
      - uses: actions/upload-artifact@v4
        with:
          name: StubbsCue-macOS
          path: |
            build/StubbsCue_artefacts/Release/StubbsCue-macOS.zip
            build/StubbsCue_artefacts/Release/StubbsCue-AU.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --target StubbsCue_VST3 -j3
      - uses: actions/upload-artifact@v4
        with:
          name: StubbsCue-Windows
          path: build/StubbsCue_artefacts/Release/VST3/

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Zip windows build
        run: cd dist/StubbsCue-Windows && zip -r ../StubbsCue-Windows.zip . && cd ../..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Stubbs Cue latest
          files: |
            dist/StubbsCue-macOS/StubbsCue-macOS.zip
            dist/StubbsCue-macOS/StubbsCue-AU.pkg
            dist/StubbsCue-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
